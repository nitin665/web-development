<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        div{
            border: 1px solid;
        }
    </style>
</head>
<body>
    <!--row 1 logo, company name, icons, welcome, logout-->>
    <div class="row">
        <div class="col-1">logo</div>
        <div class="col-4">company</div>
        <div class="col-3">icon</div>
        <div class="col-3">welcome</div>
        <div class="col-1">logout</div>
    </div>
    <!--row 2 menu bar, search-->
    <div class="row">
        <div class="col-6">menu bar</div>
        <div class="col-6">search </div>
    </div>
    <!--row 3 scrolling text-->
    <div class="row">
        <div class="col-10">scroll text</div>
    </div>    
    <!--row 4 sliding image-->
    <div class="row">
        <div class="col-12">sliding</div>
    </div>
    <!--row 5 card-->
    <div class="row">
        <div class="col-3">card 1</div>
        <div class="col-3">card 2</div>
        <div class="col-3">card 3</div>
        <div class="col-3">card 4</div>
    </div>
</body>
</html>
