<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      div {
        border: 1px solid;
      }
      .title {
        font-size: 45px;
        font-weight: bold;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <!--row 1 logo, company name, icons, welcome, logout-->>
    <div class="row">
      <div class="col-1"><img src="for1.png" alt="" width="95px" /></div>
      <div class="col-4">
        <span class="title" style="color: rgb(0, 0, 0)">FORMULA 1</span>
      </div>
      <div class="col-3">
        <i
          class="bi bi-instagram"
          style="color: rgb(0, 0, 0); font-size: 35px"
        ></i>
        <i
          class="bi bi-facebook"
          style="color: rgb(0, 0, 0); font-size: 35px"
        ></i>
      </div>
      <div class="col-3">
        <span class="title" style="color: rgb(0, 0, 0); font-size: 25px"
          >WELCOME NITIN</span
        >
      </div>
      <div class="col-1">
        <a href=""
          ><i
            class="bi bi-box-arrow-right"
            style="font-size: 35px; color: red"
          ></i
        ></a>
      </div>
    </div>
    <!--row 2 menu bar, search-->
    <div class="row">
      <div class="col-6">MENU BAR</div>
      <div class="col-3">
        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Recipient’s username"
            aria-label="Recipient’s username"
            aria-describedby="basic-addon2"
          />
          <i class="bi bi-search" style="font-size: 20px"></i>
        </div>
      </div>
    </div>
    <!--row 3 scrolling text-->
    <div class="row">
      <div class="col-10">scroll text</div>
    </div>
    <!--row 4 sliding image-->
    <div class="row">
      <div class="col-12">
        <div
          id="carouselExampleIndicators"
          class="carousel slide"
          class="carousel slide"
          data-bs-ride="carousel"
        >
          <div class="carousel-indicators">
            <button
              type="button"
              style="background-color: black"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
              aria-label="Slide 1"
            ></button>
            <button
              type="button"
              style="background-color: black"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="1"
              aria-label="Slide 2"
            ></button>
            <button
              type="button"
              style="background-color: black"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="2"
              aria-label="Slide 3"
            ></button>
            <button
              type="button"
              style="background-color: black"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="3"
              aria-label="Slide 4"
            ></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="f2.webp" class="d-block w-100" alt="..." />
            </div>
            <div class="carousel-item">
              <img src="s1.jpg" class="d-block w-100" alt="..." />
            </div>
            <div class="carousel-item">
              <img
                src="porsche_911_wallpapers_carrera_s_desktop.jpg"
                class="d-block w-100"
                alt="..."
              />
            </div>
            <div class="carousel-item">
              <img src="cricket.jfif" class="d-block w-100" alt="..." />
            </div>
          </div>
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
    </div>
    <!--row 5 card-->
    <div class="row">
      <div style="display: flex">
      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">
            <img src="for1.png" style="width: 50%" alt="" />
          </h5>
          <p class="card-text">formula 1</p>
          <a href="https://www.formula1.com/" class="btn btn-primary">more</a>
        </div>
      </div>
      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">
            <img src="for1.png" style="width: 50%" alt="" />
          </h5>
          <p class="card-text">formula 1</p>
          <a href="https://www.formula1.com/" class="btn btn-primary">more</a>
        </div>
      </div>
      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">
            <img src="for1.png" style="width: 50%" alt="" />
          </h5>
          <p class="card-text">formula 1</p>
          <a href="https://www.formula1.com/" class="btn btn-primary">more</a>
        </div>
      </div>
      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">
            <img src="for1.png" style="width: 50%" alt="" />
          </h5>
          <p class="card-text">formula 1</p>
          <a href="https://www.formula1.com/" class="btn btn-primary">more</a>
        </div>
      </div>
    </div>
  </body>
</html>
