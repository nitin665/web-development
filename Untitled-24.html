<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Login Page</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }

      .left-side {
        background-image: url("https://picsum.photos/800/1200"); /* Replace with your image */
        background-size: cover;
        background-position: center;
      }

      .right-side {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
      }

      .login-box {
        width: 100%;
        max-width: 380px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid h-100">
      <div class="row h-100">
        <!-- Left Half (Image Section) -->
        <div class="col-md-6 left-side d-none d-md-block"></div>

        <!-- Right Half (Login Form) -->
        <div class="col-md-6 right-side">
          <div class="login-box">
            <h2 class="mb-4 text-center">Login</h2>

            <form>
              <div class="mb-3">
                <label for="email" class="form-label">Email / Login ID</label>
                <input
                  type="text"
                  class="form-control"
                  id="email"
                  placeholder="Enter your email or login ID"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Enter password"
                  required
                />
              </div>

              <div class="d-flex justify-content-between mb-3">
                <a href="#" class="text-decoration-none">Forgot Password?</a>
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
